# CUTEmake conda environment (dynamic / unpinned)
# ---------------------------------------------------------------------------------------
# Versions are given as lower bounds only, so that the solver picks whatever is current at
# install time. Use a pinned export (conda env export) if you need to reproduce an exact
# environment for a publication.
#
#   conda config --set channel_priority strict
#   conda env create -f CUTEmake_conda_env.yaml
#   conda activate CUTEmake
#
# Mamba is strongly recommended, the DESeq2 dependency tree is slow to solve with classic
# conda:
#   mamba env create -f CUTEmake_conda_env.yaml
# ---------------------------------------------------------------------------------------

name: CUTEmake

channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  ### workflow manager and python stack -------------------------------------------------
  - python >=3.11
  - snakemake >=8.16
  - pandas >=2.0
  - numpy >=1.24
  - pyyaml

  ### read trimming and alignment --------------------------------------------------------
  - cutadapt >=4.9
  - bowtie2 >=2.5
  - samtools >=1.20
  - gatk4 >=4.5              # FixMateInformation, required by the analyses workflow
  - bedtools >=2.31
  - pigz

  ### coverage tracks and peak calling ---------------------------------------------------
  - deeptools >=3.5.5        # alignmentSieve, bamCoverage, multiBamSummary, plotFingerprint
  - macs3 >=3.0.1            # --ratio requires >=3.0
  - gopeaks >=1.0
  - seacr >=1.3              # not called by the workflow, kept for manual use
  - subread >=2.0.6          # featureCounts, alternative greenlist counting backend

  ### quality controls and reporting -----------------------------------------------------
  - fastqc >=0.12
  - multiqc >=1.23
  - pdfcombine
  - ghostscript

  ### R -----------------------------------------------------------------------------------
  - r-base >=4.3
  - r-ggplot2
  - r-dplyr                  # used by the Lorenz curve summary, missing in the old env
  - bioconductor-deseq2      # estimateSizeFactorsForMatrix, greenlist normalization
